name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SECRET_KEY: ci-only-not-a-secret
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartcop
          POSTGRES_PASSWORD: smartcop
          POSTGRES_DB: smartcop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcop" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://smartcop:smartcop@localhost:5432/smartcop
      REDIS_URL: redis://localhost:6379/0
      # No worker runs in CI, so background jobs run inline.
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrations are in step with the models
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply to an empty database
        run: python manage.py migrate --noinput
      - name: Tests with coverage
        run: |
          coverage run manage.py test core users ai police --noinput
          coverage report --fail-under=85
      - name: Deployment checks (production settings)
        env:
          DJANGO_SETTINGS_MODULE: Smartcop_backend.settings.prod
          ALLOWED_HOSTS: api.example.org
          CORS_ALLOWED_ORIGINS: https://app.example.org
          FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: python manage.py check --deploy --fail-level ERROR

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
      - name: No new secrets in the code
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The image builds
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: smartcop-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

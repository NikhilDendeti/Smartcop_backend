components:
  schemas:
    AIAssessmentRequest:
      type: object
      properties:
        incident_summary:
          type: string
          maxLength: 5000
      required:
      - incident_summary
    AIConfig:
      type: object
      properties:
        provider:
          type: string
        fallback_provider:
          type: string
        canary_provider:
          type: string
        canary_percent:
          type: integer
        models_by_task:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        timeout_seconds:
          type: integer
        max_retries:
          type: integer
        monthly_budget_usd:
          type: string
          nullable: true
        kill_switch:
          type: boolean
        updated_at:
          type: string
          nullable: true
      required:
      - canary_percent
      - canary_provider
      - fallback_provider
      - kill_switch
      - max_retries
      - models_by_task
      - monthly_budget_usd
      - provider
      - timeout_seconds
      - updated_at
    AIDraft:
      type: object
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
      required:
      - document_type
    AIPreview:
      type: object
      properties:
        ai_status:
          type: string
        needs_review:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        act:
          type: string
        is_cognizable:
          type: boolean
          nullable: true
        ipc_sections:
          type: object
          additionalProperties:
            type: string
          description: 'Section number to title, e.g. {''303(2)'': ''Theft''}'
        AI_urgency_score:
          type: integer
      required:
      - act
      - ai_status
      - ipc_sections
      - is_cognizable
      - needs_review
      - reasons
    AIReview:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/AIReviewDecisionEnum'
        sections:
          type: object
          additionalProperties:
            type: string
            maxLength: 300
        is_cognizable:
          type: boolean
        urgency_score:
          type: integer
          maximum: 100
          minimum: 0
        notes:
          type: string
          default: ''
          maxLength: 2000
      required:
      - decision
    AIReviewDecisionEnum:
      enum:
      - accepted
      - edited
      - rejected
      type: string
      description: |-
        * `accepted` - accepted
        * `edited` - edited
        * `rejected` - rejected
    AIUsage:
      type: object
      properties:
        period_days:
          type: integer
        calls:
          type: integer
        failed_calls:
          type: integer
        failure_rate:
          type: number
          format: double
          nullable: true
        fallback_calls:
          type: integer
        latency_ms:
          $ref: '#/components/schemas/Latency'
        tokens:
          $ref: '#/components/schemas/Tokens_'
        cost_usd:
          type: number
          format: double
          nullable: true
        month_to_date_cost_usd:
          type: number
          format: double
        monthly_budget_usd:
          type: number
          format: double
          nullable: true
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        review_queue_size:
          type: integer
        pending_assessments:
          type: integer
        officer_reviews:
          type: integer
        officer_override_rate:
          type: number
          format: double
          nullable: true
        kill_switch:
          type: boolean
      required:
      - breakdown
      - calls
      - cost_usd
      - failed_calls
      - failure_rate
      - fallback_calls
      - kill_switch
      - latency_ms
      - month_to_date_cost_usd
      - monthly_budget_usd
      - officer_override_rate
      - officer_reviews
      - pending_assessments
      - period_days
      - review_queue_size
      - tokens
    AccusedInput:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 100
        description:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
        statement:
          type: string
          nullable: true
    Ask:
      type: object
      properties:
        complaint_id:
          type: string
          format: uuid
        question:
          type: string
          maxLength: 1000
      required:
      - complaint_id
      - question
    AssignComplaint:
      type: object
      properties:
        complaint_id:
          type: string
          format: uuid
        head_constable_phone:
          type: string
          maxLength: 15
        notes:
          type: string
          default: ''
        version:
          type: integer
          minimum: 1
      required:
      - complaint_id
      - head_constable_phone
    AssignResult:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        assigned_to:
          $ref: '#/components/schemas/AssignedOfficer'
      required:
      - assigned_to
      - message
      - status
    AssignedOfficer:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
      required:
      - name
      - phone
    AssistantAnswer:
      type: object
      properties:
        answer:
          type: string
        needs_human:
          type: boolean
        ai_available:
          type: boolean
      required:
      - ai_available
      - answer
      - needs_human
    BlankEnum:
      enum:
      - ''
    CanaryProviderEnum:
      enum:
      - openai
      - anthropic
      type: string
      description: |-
        * `openai` - openai
        * `anthropic` - anthropic
    CaseSummary:
      type: object
      properties:
        summary:
          type: string
        facts:
          type: array
          items:
            $ref: '#/components/schemas/SummaryFact'
        open_questions:
          type: array
          items:
            type: string
        disclaimer:
          type: string
      required:
      - disclaimer
      - facts
      - open_questions
      - summary
    CaseTypeCreate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/NameEnum'
      required:
      - name
    CaseTypeCreated:
      type: object
      properties:
        case_type_id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - case_type_id
      - name
    CaseTypeEnum:
      enum:
      - murder
      - theft
      - crime_against_women
      - public_nuisance
      type: string
      description: |-
        * `murder` - murder
        * `theft` - theft
        * `crime_against_women` - crime_against_women
        * `public_nuisance` - public_nuisance
    CaseTypeRow:
      type: object
      properties:
        case_type_id:
          type: string
          format: uuid
        name:
          type: string
        label:
          type: string
      required:
      - case_type_id
      - label
      - name
    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
        at:
          type: string
      required:
      - at
      - content
      - role
    CitizenAssessment:
      type: object
      properties:
        ai_status:
          type: string
          nullable: true
        ipc_sections:
          type: object
          additionalProperties:
            type: string
          description: 'Section number to title, e.g. {''303(2)'': ''Theft''}'
        ipc_descriptions:
          type: object
          additionalProperties:
            type: string
          description: 'Section number to title, e.g. {''303(2)'': ''Theft''}'
        urgency_score:
          type: integer
          nullable: true
        model_version:
          type: string
          nullable: true
        generated_at:
          type: string
          nullable: true
      required:
      - ai_status
      - generated_at
      - ipc_descriptions
      - ipc_sections
      - model_version
      - urgency_score
    CitizenComplaintDetail:
      type: object
      properties:
        complaint_id:
          type: string
          format: uuid
        case_type:
          type: string
        incident_summary:
          type: string
        location:
          type: string
        incident_date:
          type: string
        incident_time:
          type: string
        is_cognizable:
          type: boolean
        status:
          type: string
        status_label:
          type: string
        progress_percent:
          type: integer
        ai_status:
          type: string
          nullable: true
        ai_urgency_score:
          type: integer
        created_at:
          type: string
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        assessment:
          $ref: '#/components/schemas/CitizenAssessment'
        accused:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        witnesses:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        evidence_files:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceFileRow'
        user:
          type: object
          additionalProperties: {}
        evidence:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - accused
      - ai_status
      - ai_urgency_score
      - assessment
      - case_type
      - complaint_id
      - created_at
      - evidence
      - evidence_files
      - incident_date
      - incident_summary
      - incident_time
      - is_cognizable
      - location
      - progress_percent
      - status
      - status_label
      - timeline
      - user
      - witnesses
    CitizenComplaintRow:
      type: object
      properties:
        complaint_id:
          type: string
          format: uuid
        case_type:
          type: string
        status:
          type: string
        status_label:
          type: string
        progress_percent:
          type: integer
        incident_summary:
          type: string
        incident_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        ai_status:
          type: string
          nullable: true
      required:
      - ai_status
      - case_type
      - complaint_id
      - created_at
      - incident_date
      - incident_summary
      - progress_percent
      - status
      - status_label
    ComplaintCreate:
      type: object
      properties:
        case_type:
          $ref: '#/components/schemas/CaseTypeEnum'
        incident_summary:
          type: string
          maxLength: 5000
        location:
          type: string
          maxLength: 1000
        incident_date:
          type: string
          format: date
        incident_time:
          type: string
          format: time
        station_id:
          type: string
          format: uuid
          nullable: true
        is_cognizable:
          type: boolean
          default: true
        accused:
          type: array
          items:
            $ref: '#/components/schemas/AccusedInput'
        witnesses:
          type: array
          items:
            $ref: '#/components/schemas/WitnessInput'

# Local stack: API + PostgreSQL + Redis. Run with `docker compose up --build`.
services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn Smartcop_backend.wsgi:application --bind 0.0.0.0:8000 --reload"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: Smartcop_backend.settings.dev
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgres://smartcop:smartcop@db:5432/smartcop
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartcop
      POSTGRES_PASSWORD: smartcop
      POSTGRES_DB: smartcop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

volumes:
  pgdata:

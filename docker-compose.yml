# Local stack: API + background worker + PostgreSQL + Redis. Run with `docker compose up --build`.
x-app: &app
  build: .
  environment: &app-env
    DJANGO_SETTINGS_MODULE: Smartcop_backend.settings.dev
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    DATABASE_URL: postgres://smartcop:smartcop@db:5432/smartcop
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    ALLOWED_HOSTS: localhost,127.0.0.1
    CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3000,http://localhost:5173,http://localhost:4173
    # Local development only: every login code is this value, so no SMS provider is needed.
    DEV_FIXED_OTP: ${DEV_FIXED_OTP:-123456}
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn Smartcop_backend.wsgi:application --bind 0.0.0.0:8000 --reload"
    ports:
      # Change API_PORT if 8000 is already taken on your machine.
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A Smartcop_backend worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A Smartcop_backend inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartcop
      POSTGRES_PASSWORD: smartcop
      POSTGRES_DB: smartcop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

volumes:
  pgdata:
